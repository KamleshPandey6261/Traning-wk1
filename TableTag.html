<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>This is table tag </h2>
         <table border="3px" cellpadding="40px" cellspacing="40px">
            <tr>
                <thead bgcolor="pink" height="70px">
                    <th>id</th>
                    <th>name</th>
                    <th>city</th>
                </thead>
            </tr>
            <tbody>
                <tr>
                    <td colspan="3">10</td>
                    
                </tr>
                 <tr>
                    <td rowspan="3">10</td>
                    <td>Ram</td>
                    <td>Rewa</td>
                </tr>
                 <tr>
                    <td>10</td>
                    <td>Ram</td>
                    <td>Rewa</td>
                </tr>
            </tbody>
         </table>
</body>
</html>
