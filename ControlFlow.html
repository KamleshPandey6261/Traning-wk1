<script>
     let hindi=Number(prompt("Enter the hindi marks :"));
     let eng=Number(prompt("Enter the english marks :"));
     let  math=Number(prompt("Enter the math marks :"));
     let  sanskrit=Number(prompt("Enter the Sanskrit marks :"));
     let socialScience=Number(prompt("Enter the Social Science marks :"));
     let science =Number(prompt("Enter the Science marks :"));
     let  per=(hindi+eng+math+sanskrit+socialScience+science)/6;
if(hindi>=35 && eng>=35 && math>=35 && sanskrit>=35 && socialScience >=35 && science>=35 ){

    if(per>=60){
        console.log("Great you passed in first division !",per);
    }
   else if(per<60 && per >=50){
        console.log(" Great you passed in second division !",per);
    }
    else if(per<50 && per >=35){
        console.log("Great you passed in third division ",per);
    }
}
 else{
        console.log(" You failed") ;
    }
</script>
