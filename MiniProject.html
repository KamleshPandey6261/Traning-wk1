<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
      body {
         display: flex;
         align-items: center;
         justify-content: center;
         background: linear-gradient(black, yellow, green, blue);
         height: 100vh;
      }

      .container {
         background-color: lightgray;
         padding: 15px;
         border-radius: 10px;
      }

      .registration {
         font-size: 30px;
         font-family: algerian;
         text-align: center;
         border-bottom: 3px dashed red;
      }

      form .container2 {
         display: flex;
         flex-wrap: wrap;
      }

      form .container2 .inputbox {
         width: calc(100% / 2 - 20px);
         margin: 10px;
      }

      form .container2 .inputbox input {
         height: 45px;
         width: 100%;
      }

      .btn {
         width: 100%;
         text-align: center;
         font-size: 25px;
         background-color: blue;
         color: white;
         border: none;
         height: 1cm;
      }
   </style>
</head>

<body>
   <div class="container">
      <div class="registration"> Registration Form </div>
      <form action="">
         <div class="container2">
            <div class="inputbox">
               <span class="inputtext"> Full Name</span>
               <input type="text" placeholder="Enter the full name" required>
            </div>
            <div class="inputbox">
               <span class="inputtext"> User Name</span>
               <input type="text" placeholder="Enter the user name" required>
            </div>
            <div class="inputbox">
               <span class="inputtext"> Email</span>
               <input type="email" placeholder="Enter the email" required>
            </div>
            <div class="inputbox">
               <span class="inputtext"> Phone Number</span>
               <input type="tel" placeholder="Enter the phone number" pattern="[0-9]{10}" required minlength="10" maxlength="10">

            </div>
            <div class="inputbox">
               <span class="inputtext"> Password</span>
               <input type="password" placeholder="Enter the password" required minlength="5">
            </div>


            <div class="inputbox">
               <span class="inputtext"> Confirm Password</span>
               <input type="password" placeholder="Enter the confirm password" required minlength="5">
            </div>
            <input type="submit" value="Ok" class="btn">
         </div>
      </form>
   </div>
</body>

</html>
