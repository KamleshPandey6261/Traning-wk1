<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          h1{
            border: solid 5px black;
            size: 20px;
            font-weight: 1px;
          }
    </style>
</head>
<body>
       <h1 style="border-style: dotted;">hello</h1>
       <h1 style="border-style: solid; ">hello</h1>
       <h1 style="border-style: dashed;">hello</h1>
       <h1 style="border-style: double;">hello</h1>
       <h1 style="border-style: groove;">hello</h1>
       <h1 style="border-style: ridge;">hello</h1>
       <h1 style="border-style: inset;">hello</h1>
       <h1 style="border-style: outset;">hello</h1>
    
</body>
</html>
